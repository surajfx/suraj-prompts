<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suraj Prompts</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0a0a0a;
    color: white;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    padding: 15px 20px;
    background: #111;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #8A2BE2;
}

.cta {
    background: #8A2BE2;
    padding: 8px 15px;
    border-radius: 20px;
    color: white;
    text-decoration: none;
    box-shadow: 0 0 10px #8A2BE2;
}

/* SEARCH */
.search-box {
    padding: 15px;
    text-align: center;
}

.search-box input {
    width: 80%;
    padding: 10px;
    border-radius: 20px;
    border: none;
    outline: none;
}

/* CARDS */
.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 20px;
}

.card {
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    padding: 15px;
    transition: 0.3s;
    box-shadow: 0 0 10px rgba(138,43,226,0.3);
}

.card:hover {
    transform: scale(1.05);
}

.card img {
    width: 100%;
    border-radius: 10px;
}

.prompt {
    font-size: 14px;
    margin: 10px 0;
}

.copy-btn {
    background: #00FFFF;
    border: none;
    padding: 8px;
    border-radius: 10px;
    cursor: pointer;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    background: #111;
}
</style>
</head>

<body>

<header>
    <div class="logo">Suraj Prompts</div>
    <a href="https://whatsapp.com/..." class="cta">Join WhatsApp</a>
</header>

<div class="search-box">
    <input type="text" id="search" placeholder="Search prompts...">
</div>

<div class="container" id="cards">

    <!-- CARD 1 -->
    <div class="card">
        <img src="https://picsum.photos/300/200" />
        <div class="prompt">Ultra realistic cinematic Indian girl portrait, DSLR, soft lighting</div>
        <button class="copy-btn" onclick="copyText(this)">Copy</button>
    </div>

    <!-- CARD 2 -->
    <div class="card">
        <img src="https://picsum.photos/301/200" />
        <div class="prompt">Anime boy aesthetic, detailed eyes, studio ghibli style</div>
        <button class="copy-btn" onclick="copyText(this)">Copy</button>
    </div>

    <!-- CARD 3 -->
    <div class="card">
        <img src="https://picsum.photos/302/200" />
        <div class="prompt">Realistic face, skin texture, 50mm lens, natural lighting</div>
        <button class="copy-btn" onclick="copyText(this)">Copy</button>
    </div>

</div>

<footer>
    © 2026 Suraj Prompts
</footer>

<script>
function copyText(btn) {
    let text = btn.previousElementSibling.innerText;
    navigator.clipboard.writeText(text);
    btn.innerText = "Copied!";
    setTimeout(() => btn.innerText = "Copy", 2000);
}

// SEARCH FILTER
document.getElementById("search").addEventListener("keyup", function() {
    let value = this.value.toLowerCase();
    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        let text = card.innerText.toLowerCase();
        card.style.display = text.includes(value) ? "block" : "none";
    });
});
</script>

</body>
</html>
